name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository name to publish
        required: true
        type: string
      image-tag:
        description: Tag applied to the published image
        required: false
        type: string
        default: latest
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      push:
        description: Whether to push the image after building
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_TOKEN:
        required: true
    outputs:
      image-digest:
        description: Digest of the published image
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Report digest
        run: echo "Published ${{ inputs.image-name }}:${{ inputs.image-tag }}"
