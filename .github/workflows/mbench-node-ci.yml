name: mbench Node CI
on:
  workflow_dispatch:

jobs:
  build:
    name: Node Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: NPM Build
        run: npm ci && npm run build
      - name: NPM Test
        run: npm test
