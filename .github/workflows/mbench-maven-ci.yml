name: mbench Maven CI
on:
  workflow_dispatch:

jobs:
  build:
    name: Maven Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven Build
        run: mvn -B package -DskipTests
      - name: Maven Test
        run: mvn -B test
